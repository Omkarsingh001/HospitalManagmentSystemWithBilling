<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Doctors — MediCare HMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(activePage='doctors')}"></div>

<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <h2>Doctor Management</h2>
      <p>Manage hospital doctors and their specializations</p>
    </div>
    <div class="topbar-right">
      <a th:href="@{/logout}" class="btn topbar-btn btn-danger-soft">🚪 Logout</a>
    </div>
  </header>

  <main class="page-content">

    <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>

    <div class="page-header">
      <div>
        <h2>All Doctors</h2>
        <p th:text="${doctors.size()} + ' doctors registered'"></p>
      </div>
      <a th:href="@{/doctors/add}" class="btn btn-primary">➕ Add New Doctor</a>
    </div>

    <!-- Search -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card-body" style="padding:16px 24px;">
        <form th:action="@{/doctors}" method="get" class="search-bar">
          <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" name="search" class="form-control"
                   placeholder="Search by name or specialization..."
                   th:value="${search}"/>
          </div>
          <button type="submit" class="btn btn-primary">Search</button>
          <a th:href="@{/doctors}" class="btn btn-outline">Clear</a>
        </form>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Specialization</th>
              <th>Contact</th>
              <th>Available</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${doctors.empty}">
              <td colspan="6">
                <div class="empty-state">
                  <div class="empty-icon">🩺</div>
                  <h3>No doctors found</h3>
                  <p>Add your first doctor to get started</p>
                </div>
              </td>
            </tr>
            <tr th:each="d : ${doctors}">
              <td class="td-muted" th:text="'#' + ${d.id}"></td>
              <td><strong th:text="${d.name}"></strong></td>
              <td>
                <span class="badge badge-primary" th:text="${d.specialization}"></span>
              </td>
              <td th:text="${d.contact}"></td>
              <td>
                <span class="badge"
                  th:classappend="${d.available} ? 'badge-success' : 'badge-danger'"
                  th:text="${d.available} ? '✓ Available' : '✗ Unavailable'"></span>
              </td>
              <td>
                <div class="action-btns">
                  <a th:href="@{/doctors/edit/{id}(id=${d.id})}"
                     class="btn btn-sm btn-outline">✏️ Edit</a>
                  <a th:href="@{/doctors/delete/{id}(id=${d.id})}"
                     class="btn btn-sm btn-danger"
                     onclick="return confirm('Delete this doctor?')">🗑️ Delete</a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>
</body>
</html>
