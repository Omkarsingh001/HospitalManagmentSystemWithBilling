<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Patient Bills — MediCare HMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(activePage='billing')}"></div>

<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <h2>Patient Bill Summary</h2>
      <p th:text="'All bills for: ' + ${patient.name}"></p>
    </div>
    <div class="topbar-right">
      <a th:href="@{/billing}" class="btn topbar-btn btn-ghost">← Back to Billing</a>
      <a th:href="@{/logout}" class="btn topbar-btn btn-danger-soft">🚪 Logout</a>
    </div>
  </header>

  <main class="page-content">

    <!-- Patient Info Card -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card-body" style="display:flex;align-items:center;gap:24px;flex-wrap:wrap;">
        <div style="width:60px;height:60px;background:var(--primary-light);border-radius:50%;
                    display:flex;align-items:center;justify-content:center;font-size:1.8rem;">👤</div>
        <div>
          <div style="font-family:'Outfit',sans-serif;font-size:1.3rem;font-weight:800;"
               th:text="${patient.name}"></div>
          <div style="color:var(--gray-500);font-size:0.85rem;"
               th:text="'Age: ' + ${patient.age} + '  |  ' + ${patient.gender} + '  |  ' + ${patient.contact}"></div>
        </div>
        <div class="summary-box" style="margin-left:auto;">
          <div class="summary-label">Total Bill Amount</div>
          <div class="summary-value"
               th:text="'₹' + ${#numbers.formatDecimal(total,1,'COMMA',2,'POINT')}">₹0</div>
        </div>
      </div>
    </div>

    <!-- Bills Table -->
    <div class="card">
      <div class="card-header">
        <span class="card-title">📄 Bill Records</span>
        <a th:href="@{/billing/add}" class="btn btn-sm btn-primary">Add Bill</a>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr><th>ID</th><th>Treatment</th><th>Amount (₹)</th><th>Status</th><th>Date</th><th>Actions</th></tr>
          </thead>
          <tbody>
            <tr th:if="${bills.empty}">
              <td colspan="6">
                <div class="empty-state">
                  <div class="empty-icon">📄</div>
                  <h3>No bills for this patient</h3>
                </div>
              </td>
            </tr>
            <tr th:each="b : ${bills}">
              <td class="td-muted" th:text="'#' + ${b.id}"></td>
              <td th:text="${b.treatment}"></td>
              <td><strong th:text="'₹' + ${#numbers.formatDecimal(b.amount,1,'COMMA',2,'POINT')}"></strong></td>
              <td>
                <span class="badge"
                  th:classappend="${b.paymentStatus == 'Paid'} ? 'badge-success' :
                                  (${b.paymentStatus == 'Cancelled'} ? 'badge-danger' : 'badge-warning')"
                  th:text="${b.paymentStatus}"></span>
              </td>
              <td class="td-muted" th:text="${#strings.abbreviate(b.billDate,10)}"></td>
              <td>
                <div class="action-btns">
                  <a th:href="@{/billing/status/{id}(id=${b.id},status='Paid')}"
                     class="btn btn-sm btn-success">✅ Paid</a>
                  <a th:href="@{/billing/status/{id}(id=${b.id},status='Pending')}"
                     class="btn btn-sm btn-outline">⏳ Pending</a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>
</body>
</html>
