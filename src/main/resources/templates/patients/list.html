<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Patients — MediCare HMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(activePage='patients')}"></div>

<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <h2>Patient Management</h2>
      <p>Manage all patient records</p>
    </div>
    <div class="topbar-right">
      <a th:href="@{/logout}" class="btn topbar-btn btn-danger-soft">🚪 Logout</a>
    </div>
  </header>

  <main class="page-content">

    <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>

    <div class="page-header">
      <div>
        <h2>All Patients</h2>
        <p th:text="${patients.size()} + ' records found'"></p>
      </div>
      <a th:href="@{/patients/add}" class="btn btn-primary">➕ Add New Patient</a>
    </div>

    <!-- Search -->
    <div class="card" style="margin-bottom:20px;">
      <div class="card-body" style="padding:16px 24px;">
        <form th:action="@{/patients}" method="get" class="search-bar">
          <div class="search-input-wrap">
            <span class="search-icon">🔍</span>
            <input type="text" name="search" class="form-control"
                   placeholder="Search by name or contact..."
                   th:value="${search}"/>
          </div>
          <button type="submit" class="btn btn-primary">Search</button>
          <a th:href="@{/patients}" class="btn btn-outline">Clear</a>
        </form>
      </div>
    </div>

    <!-- Table -->
    <div class="card">
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Name</th>
              <th>Age</th>
              <th>Gender</th>
              <th>Contact</th>
              <th>Address</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody>
            <tr th:if="${patients.empty}">
              <td colspan="7">
                <div class="empty-state">
                  <div class="empty-icon">👤</div>
                  <h3>No patients found</h3>
                  <p>Add your first patient to get started</p>
                </div>
              </td>
            </tr>
            <tr th:each="p : ${patients}">
              <td class="td-muted" th:text="'#' + ${p.id}"></td>
              <td><strong th:text="${p.name}"></strong></td>
              <td th:text="${p.age}"></td>
              <td>
                <span class="badge"
                  th:classappend="${p.gender == 'Male'} ? 'badge-primary' : 'badge-secondary'"
                  th:text="${p.gender}"></span>
              </td>
              <td th:text="${p.contact}"></td>
              <td class="td-muted" th:text="${p.address}"></td>
              <td>
                <div class="action-btns">
                  <a th:href="@{/patients/edit/{id}(id=${p.id})}"
                     class="btn btn-sm btn-outline">✏️ Edit</a>
                  <a th:href="@{/billing/patient/{id}(id=${p.id})}"
                     class="btn btn-sm btn-primary">💰 Bills</a>
                  <a th:href="@{/patients/delete/{id}(id=${p.id})}"
                     class="btn btn-sm btn-danger"
                     onclick="return confirm('Delete this patient? This will also remove their appointments and bills.')">
                    🗑️ Delete
                  </a>
                </div>
              </td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </main>
</div>
</body>
</html>
