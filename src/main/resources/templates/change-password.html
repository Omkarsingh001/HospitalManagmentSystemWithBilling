<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Change Password — MediCare HMS</title>
  <link rel="stylesheet" th:href="@{/css/style.css}"/>
</head>
<body>

<div th:replace="~{fragments/sidebar :: sidebar(activePage='password')}"></div>

<div class="main-wrapper">
  <header class="topbar">
    <div class="topbar-left">
      <h2>Change Password</h2>
      <p>Update your admin account password</p>
    </div>
    <div class="topbar-right">
      <a th:href="@{/dashboard}" class="btn topbar-btn btn-ghost">← Dashboard</a>
      <a th:href="@{/logout}" class="btn topbar-btn btn-danger-soft">🚪 Logout</a>
    </div>
  </header>

  <main class="page-content">
    <div class="card" style="max-width:480px;margin:0 auto;">
      <div class="card-header">
        <span class="card-title">🔑 Update Password</span>
      </div>
      <div class="card-body">

        <div th:if="${error}"   class="alert alert-danger">⚠️ <span th:text="${error}"></span></div>
        <div th:if="${success}" class="alert alert-success">✅ <span th:text="${success}"></span></div>

        <form th:action="@{/change-password}" method="post">
          <div class="form-group" style="margin-bottom:18px;">
            <label class="form-label">Current Password *</label>
            <input type="password" name="currentPassword" class="form-control"
                   placeholder="Enter current password" required/>
          </div>
          <div class="form-group" style="margin-bottom:18px;">
            <label class="form-label">New Password *</label>
            <input type="password" name="newPassword" class="form-control"
                   placeholder="Enter new password" required/>
          </div>
          <div class="form-group" style="margin-bottom:24px;">
            <label class="form-label">Confirm New Password *</label>
            <input type="password" name="confirmPassword" class="form-control"
                   placeholder="Re-enter new password" required/>
          </div>
          <button type="submit" class="btn btn-primary" style="width:100%;">
            🔒 Update Password
          </button>
        </form>

      </div>
    </div>
  </main>
</div>
</body>
</html>
